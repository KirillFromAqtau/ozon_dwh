[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # стиль, ошибки, предупреждения, порядок импортов

[tool.ruff.lint.isort]
known-first-party = ["db", "migrate", "run_sql", "dq_checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
