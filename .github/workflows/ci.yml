# CI: при каждом push и pull request GitHub поднимает чистый PostgreSQL,
# применяет схему с нуля и прогоняет тесты.
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:                      # отдельный контейнер с базой на время прогона
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ozon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ozon_test"
          --health-interval 5s
          --health-retries 10
    env:                             # тестовые значения, не секреты
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DB: ozon_test
      PG_USER: ci
      PG_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Fresh install — apply schema from scratch
        run: python src/migrate.py
      - name: Run tests
        run: pytest -v

  dag-check:
    name: Airflow DAG import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install "apache-airflow==3.2.2" pytest
      - run: airflow db migrate
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      - run: pytest tests/test_dag.py -v -p no:cacheprovider
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
